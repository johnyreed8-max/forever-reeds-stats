<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Forever Reeds - Interaktivní Mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #121212; font-family: sans-serif; }
        #map { width: 100%; height: 100%; background: #121212; }
        .leaflet-container { background: #121212 !important; }
        .coord-box {
            position: absolute; bottom: 15px; right: 15px; background: rgba(18, 18, 18, 0.85);
            color: #e0e0e0; padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 1000;
            border: 1px solid #333; pointer-events: none; font-family: monospace;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="coord-box" id="coord-view">X: 0 | Z: 0</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3,
            maxZoom: 5,
            zoomControl: false
        });

        L.control.zoom({ position: 'topright' }).addTo(map);

        var bounds = [[0, 0], [1824, 1568]];
        var image = L.imageOverlay('map.png', bounds).addTo(map);

        map.setView([ 912, 784 ], 0);

        var minX = -11264;
        var minZ = -11264;

        map.on('mousemove', function(e) {
            var x = Math.round(e.latlng.lng + minX);
            var z = Math.round(e.latlng.lat + minZ);
            document.getElementById('coord-view').innerHTML = "X: " + x + " &nbsp;|&nbsp; Z: " + z;
        });
    </script>
</body>
</html>
