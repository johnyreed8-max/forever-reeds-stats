name: Minecraft Stats Auto Updater

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write # Povolí GitHubu ukládat změny do vašeho repozitáře

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Příprava složky pro statistiky
      run: mkdir -p stats

    - name: Stažení statistik z Hostify FTP
      run: |
        wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/players/stats/*.json" --no-directories --accept="*.json" -P "stats" -q

    - name: Spuštění kompilace do HTML
      shell: pwsh
      run: |
        ./generator.ps1

    - name: Uložení změn zpět na GitHub
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add index.html
        git commit -m "Automatická aktualizace statistik [skip ci]" || echo "Žádné změny k uložení"
        git push
