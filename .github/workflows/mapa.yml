name: Generování měsíční mapy světa

on:
  schedule:
    # Spustí se automaticky 1. den v měsíci ve 4:00 ráno
    - cron: '0 4 1 * *'
  workflow_dispatch: # Umožní vám skript spustit i ručně kliknutím na tlačítko

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Vytvoření složek
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    - name: Kešování Minecraft regionů
      uses: actions/cache@v4
      with:
        path: ./mc_world/
        key: mc-world-${{ github.run_number }}
        restore-keys: |
          mc-world-

    - name: Rychlé paralelní stahování regionů a level.dat přes lftp
      run: |
        # Instalace lftp
        sudo apt-get update && sudo apt-get install -y lftp -qq
        
        # Bezpečné paralelní stahování regionů přes lftp (přihlášení pomocí explicitního příkazu user)
        lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" ftp://ftp.hostify.cz:21 <<EOF
        cd /minecraft/Forever%20Reeds/world/dimensions/minecraft/overworld/region/
        lcd ./mc_world/region/
        mirror --parallel=10 ./ ./mc_world/region/
        bye
        EOF
        
        # Stažení souboru level.dat
        lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" ftp://ftp.hostify.cz:21 <<EOF
        cd /minecraft/Forever%20Reeds/world/
        lcd ./mc_world/
        get level.dat
        bye
        EOF

    - name: Instalace a spuštění MinedMap (Generování mapy)
      run: |
        # Stažení nejnovějšího MinedMap
        wget -O minedmap.zip https://github.com/neocturne/MinedMap/releases/latest/download/MinedMap-2.8.0-x86_64-unknown-linux-gnu.zip
        
        # Rozbalení ZIP archivu
        unzip -q minedmap.zip
        
        # Přesun binárky do aktuálního adresáře a nastavení práv pro spuštění
        mv MinedMap-*/minedmap ./minedmap
        chmod +x ./minedmap
        
        # Vygenerování mapy ze stažených regionů
        ./minedmap mc_world mapa

    - name: Nahrání vygenerované mapy na GitHub větev
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # Přidání vygenerované mapy do gitu
        git add mapa/
        git commit -m "Automatická aktualizace mapy světa" || echo "Žádné změny v mapě"
        git push origin main
