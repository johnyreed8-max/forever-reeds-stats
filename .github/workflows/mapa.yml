name: Automatická aktualizace mapy světa (Mapcrafter)

on:
  schedule:
    - cron: '0 3 1,15 * *' # 1. a 15. den v měsíci ve 3:00 ráno
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Instalace lftp a Mapcrafter závislostí
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp mapcrafter || sudo apt-get install -y lftp python3

    - name: Vytvoření adresářové struktury
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    - name: Rychlé paralelní stažení regionů z Hostify FTP
      run: |
        echo "Stahuji level.dat..."
        wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
             "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/level.dat" \
             -O "./mc_world/level.dat" || true

        echo "Stahuji regiony Overworldu v 10 paralelních vláknech..."
        lftp -c "open ftp://ftp.hostify.cz:21; \
                 user ${{ secrets.FTP_USER }} ${{ secrets.FTP_PASSWORD }}; \
                 set net:timeout 30; \
                 set net:max-retries 10; \
                 set ftp:list-options -a; \
                 mirror --continue --parallel=10 '/minecraft/Forever Reeds/world/dimensions/minecraft/overworld/region' './mc_world/region'"

        echo "--- Počet stažených Overworld .mca souborů ---"
        find ./mc_world/region/ -name "*.mca" | wc -l

    - name: Příprava Mapcrafter konfigurace
      run: |
        cat << 'EOF' > render.conf
        output_dir = mapa

        [world:overworld]
        input_dir = mc_world
        dimension = overworld

        [map:map_overworld]
        name = Overworld
        world = overworld
        render_view = isometric
        render_mode = daylight
        EOF

    - name: Spuštění Mapcrafter Renderu
      run: |
        if command -v mapcrafter &> /dev/null; then
          mapcrafter -c render.conf -j 2
        else
          echo "Používám záložní CLI renderer..."
          pip install mcmap || true
          python3 -m mcmap mc_world mapa
        fi

    - name: Commit a Push aktualizované mapy
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        git add -A mapa/
        git commit -m "Update mapy světa přes Mapcrafter" || echo "Žádné změny k nahrání"
        git push origin main
