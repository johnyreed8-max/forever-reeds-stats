name: Automatická aktualizace mapy světa

on:
  schedule:
    - cron: '0 3 1,15 * *' # Spustí se automaticky 1. a 15. den v měsíci ve 3:00 ráno
  workflow_dispatch:      # Umožňuje i ruční spuštění jedním klikem

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Vytvoření složek
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    - name: Instalace lftp pro spolehlivé stahování
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: Stažení komplet světa z Hostify FTP
      run: |
        echo "Stahuji level.dat..."
        wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
             "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/level.dat" \
             -O "./mc_world/level.dat" || true

        echo "Stahuji kompletní regiony přes lftp zrcadlení..."
        lftp -c "open ftp://ftp.hostify.cz:21; \
                 user ${{ secrets.FTP_USER }} ${{ secrets.FTP_PASSWORD }}; \
                 cd '/minecraft/Forever Reeds/world/dimensions/minecraft/overworld/region'; \
                 mirror -c . ./mc_world/region"

        echo "--- Kontrola stažených souborů ---"
        find ./mc_world/region/ -name "*.mca" | wc -l

    - name: Generování MinedMap
      run: |
        wget -O minedmap.zip https://github.com/neocturne/MinedMap/releases/latest/download/MinedMap-2.8.0-x86_64-unknown-linux-gnu.zip
        unzip -qo minedmap.zip
        find . -name "minedmap" -type f -exec mv {} ./minedmap \;
        chmod +x ./minedmap
        
        # Vygenerování do dočasné složky raw_map
        ./minedmap mc_world raw_map -j 4

        # Příprava struktury pro viewer
        rm -rf mapa
        mkdir -p mapa/data

        mv raw_map/info.json mapa/data/
        mv raw_map/entities.json mapa/data/ || true
        mv raw_map/light mapa/data/ || true
        mv raw_map/map mapa/data/ || true
        mv raw_map/processed mapa/data/ || true
        rm -rf raw_map

        # Stažení oficiálního vieweru
        git clone https://github.com/neocturne/MinedMap.git minedmap-repo
        cp -r minedmap-repo/viewer/* mapa/
        rm -rf minedmap-repo

    - name: Nahrání aktualizované mapy na GitHub
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        git add mapa/
        git commit -m "Automatický update mapy světa" || echo "Žádné změny"
        git push origin main
