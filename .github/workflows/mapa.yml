name: Automatická aktualizace mapy světa

on:
  schedule:
    - cron: '0 3 1,15 * *' # 1. a 15. den v měsíci ve 3:00 ráno
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Instalace Pythonu a lftp
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalace lftp a Pillow
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp
        pip install Pillow

    - name: Vytvoření adresářové struktury
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    - name: Stažení regionů z Hostify FTP
      run: |
        echo "Stahuji regiony Overworldu v 10 paralelních vláknech..."
        lftp -c "open ftp://ftp.hostify.cz:21; \
                 user ${{ secrets.FTP_USER }} ${{ secrets.FTP_PASSWORD }}; \
                 set net:timeout 30; \
                 set net:max-retries 10; \
                 mirror --continue --parallel=10 '/minecraft/Forever Reeds/world/dimensions/minecraft/overworld/region' './mc_world/region'"

        echo "--- Počet stažených Overworld .mca souborů ---"
        find ./mc_world/region/ -name "*.mca" | wc -l

    - name: Generování interaktivní mapy (Leaflet)
      shell: python
      run: |
        import os
        from PIL import Image
        import struct
        zlib = __import__('zlib')

        region_dir = "mc_world/region"
        output_path = "mapa/index.html"
        img_output = "mapa/map.png"

        print("Generuji podklad pro interaktivní mapu...")
        mca_files = [f for f in os.listdir(region_dir) if f.endswith(".mca")]
        
        if not mca_files:
            print("Žádné .mca soubory nebyly nalezeny!")
            img = Image.new("RGB", (1024, 1024), color=(20, 20, 20))
            img.save(img_output)
            exit(0)

        coords = []
        for f in mca_files:
            p = f.split('.')
            if len(p) >= 3:
                try:
                    coords.append((int(p[1]), int(p[2])))
                except ValueError:
                    pass

        min_x = min(c[0] for c in coords)
        max_x = max(c[0] for c in coords)
        min_z = min(c[1] for c in coords)
        max_z = max(c[1] for c in coords)

        reg_w = max_x - min_x + 1
        reg_h = max_z - min_z + 1

        scale_w = reg_w * 32
        scale_h = reg_h * 32

        world_img = Image.new("RGB", (scale_w, scale_h), color=(25, 25, 25))
        pixels = world_img.load()

        C_LAND = (86, 125, 70)
        C_WATER = (35, 90, 155)

        for filename in mca_files:
            p = filename.split('.')
            if len(p) < 3:
                continue
            try:
                rx, rz = int(p[1]), int(p[2])
            except ValueError:
                continue

            filepath = os.path.join(region_dir, filename)
            base_px = (rx - min_x) * 32
            base_pz = (rz - min_z) * 32

            try:
                with open(filepath, "rb") as f:
                    header = f.read(8192)
                    for cx in range(32):
                        for cz in range(32):
                            i = (cx + cz * 32) * 4
                            offset = struct.unpack(">I", b'\x00' + header[i:i+3])[0]
                            if offset == 0:
                                continue
                            
                            f.seek(offset * 4096)
                            length = struct.unpack(">I", f.read(4))[0]
                            compression = f.read(1)[0]
                            data = f.read(length - 1)

                            if compression == 2:
                                try:
                                    px = base_px + cx
                                    pz = base_pz + cz
                                    if 0 <= px < scale_w and 0 <= pz < scale_h:
                                        if length < 1500:
                                            pixels[px, pz] = C_WATER
                                        else:
                                            pixels[px, pz] = C_LAND
                                except Exception:
                                    pass
            except Exception:
                pass

        os.makedirs("mapa", exist_ok=True)
        world_img.save(img_output)

        # Interaktivní HTML šablona s Leaflet.js (styl Chunkbase / Google Maps)
        html_content = """<!DOCTYPE html>
        <html lang="cs">
        <head>
            <meta charset="UTF-8">
            <title>Forever Reeds - Interaktivní Mapa</title>
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
            <style>
                body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; font-family: sans-serif; }
                #map { width: 100%; height: 100%; background: #1a1a1a; }
                .leaflet-container { background: #1a1a1a !important; }
                .coord-box {
                    position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7);
                    color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 14px; z-index: 1000;
                    border: 1px solid #444; pointer-events: none;
                }
            </style>
        </head>
        <body>
            <div id="map"></div>
            <div class="coord-box" id="coord-view">Souřadnice: X: 0, Z: 0</div>

            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
            <script>
                // Inicializace mapy v souřadnicovém systému Pixelů
                var map = L.map('map', {
                    crs: L.CRS.Simple,
                    minZoom: -2,
                    maxZoom: 4,
                    zoomControl: false
                });

                L.control.zoom({ position: 'topright' }).addTo(map);

                var bounds = [[0, 0], [""" + str(scale_h) + """, """ + str(scale_w) + """]];
                var image = L.imageOverlay('map.png', bounds).addTo(map);

                map.setView([ """ + str(scale_h // 2) + """, """ + str(scale_w // 2) + """ ], 0);

                // Dynamické sledování kurzoru a výpis Minecraft souřadnic
                var minX = """ + str(min_x * 512) + """;
                var minZ = """ + str(min_z * 512) + """;

                map.on('mousemove', function(e) {
                    var x = Math.round(e.latlng.lng + minX);
                    var z = Math.round(e.latlng.lat + minZ);
                    document.getElementById('coord-view').innerHTML = "X: " + x + " | Z: " + z;
                });
            </script>
        </body>
        </html>
        """
        
        with open(output_path, "w", encoding="utf-8") as f:
            f.write(html_content)

        print("Interaktivní mapa byla úspěšně vygenerována!")

    - name: Commit a Push aktualizované mapy
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        git add -A mapa/
        git commit -m "Update mapy světa" || echo "Žádné změny k nahrání"
        git push origin main
