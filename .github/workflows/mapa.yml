name: Generování měsíční mapy světa

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Vytvoření složek
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    # Připojení GitHub Cache (pokud cache existuje, nahraje se bleskově během vteřin)
    - name: Kešování Minecraft světa
      uses: actions/cache@v4
      with:
        path: ./mc_world/
        key: mc-world-v1-${{ github.run_number }}
        restore-keys: |
          mc-world-v1-

    - name: Stažení regionů a level.dat z Hostify FTP pomocí wget
      run: |
        # Pokud se data nahrála z cache, wget automaticky stáhne jen případné novinky (nebo můžete nechat stáhnout vše)
        wget --ftp-user="${{ secrets.FTP_USERNAME }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
             "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/dimensions/minecraft/overworld/region/*.mca" \
             -P "./mc_world/region/" -q || true

        wget --ftp-user="${{ secrets.FTP_USERNAME }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
             "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/level.dat" \
             -P "./mc_world/" -q || true

    - name: Testovací krok (pouze ověření, že data existují)
      run: |
        echo "Kontrola stažených souborů:"
        ls -la ./mc_world/
        ls -la ./mc_world/region/ | head -n 10
        echo "Počet stažených .mca souborů:"
        find ./mc_world/region/ -name "*.mca" | wc -l
