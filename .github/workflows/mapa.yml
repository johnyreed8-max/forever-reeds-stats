name: Automatická aktualizace mapy světa

on:
  schedule:
    - cron: '0 3 1,15 * *' # 1. a 15. den v měsíci ve 3:00 ráno
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Instalace Pythonu a lftp
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalace lftp a Pillow
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp
        pip install Pillow

    - name: Vytvoření adresářové struktury
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    - name: Stažení regionů z Hostify FTP
      run: |
        echo "Stahuji regiony Overworldu v 10 paralelních vláknech..."
        lftp -c "open ftp://ftp.hostify.cz:21; \
                 user ${{ secrets.FTP_USER }} ${{ secrets.FTP_PASSWORD }}; \
                 set net:timeout 30; \
                 set net:max-retries 10; \
                 mirror --continue --parallel=10 '/minecraft/Forever Reeds/world/dimensions/minecraft/overworld/region' './mc_world/region'"

        echo "--- Počet stažených Overworld .mca souborů ---"
        find ./mc_world/region/ -name "*.mca" | wc -l

    - name: Generování efektivní 2D mapy
      shell: python
      run: |
        import os
        from PIL import Image
        import struct
        zlib = __import__('zlib')

        region_dir = "mc_world/region"
        output_path = "mapa/index.html"
        img_output = "mapa/map.png"

        print("Analyzuji regiony a generuji mapu světa...")
        mca_files = [f for f in os.listdir(region_dir) if f.endswith(".mca")]
        
        if not mca_files:
            print("Žádné .mca soubory nebyly nalezeny!")
            # Vytvoříme fallback obrázek, ať web nehlásí chybu 404
            img = Image.new("RGB", (1024, 1024), color=(20, 20, 20))
            img.save(img_output)
            exit(0)

        coords = []
        for f in mca_files:
            p = f.split('.')
            if len(p) >= 3:
                try:
                    coords.append((int(p[1]), int(p[2])))
                except ValueError:
                    pass

        min_x = min(c[0] for c in coords)
        max_x = max(c[0] for c in coords)
        min_z = min(c[1] for c in coords)
        max_z = max(c[1] for c in coords)

        reg_w = max_x - min_x + 1
        reg_h = max_z - min_z + 1

        # 1 pixel = 2 chunky pro maximální rychlost a plynulost
        scale_w = reg_w * 16
        scale_h = reg_h * 16

        world_img = Image.new("RGB", (scale_w, scale_h), color=(30, 30, 30))
        pixels = world_img.load()

        # Jednoduché barvy terénu
        C_GRASS = (86, 125, 70)
        C_WATER = (40, 90, 160)
        C_SAND = (210, 200, 150)
        C_STONE = (110, 110, 110)

        for filename in mca_files:
            p = filename.split('.')
            if len(p) < 3:
                continue
            try:
                rx, rz = int(p[1]), int(p[2])
            except ValueError:
                continue

            filepath = os.path.join(region_dir, filename)
            base_px = (rx - min_x) * 16
            base_pz = (rz - min_z) * 16

            try:
                with open(filepath, "rb") as f:
                    header = f.read(8192)
                    for cx in range(32):
                        for cz in range(32):
                            i = (cx + cz * 32) * 4
                            offset = struct.unpack(">I", b'\x00' + header[i:i+3])[0]
                            if offset == 0:
                                continue
                            
                            f.seek(offset * 4096)
                            length = struct.unpack(">I", f.read(4))[0]
                            compression = f.read(1)[0]
                            data = f.read(length - 1)

                            if compression == 2: # Zlib
                                try:
                                    decompressed = zlib.decompress(data)
                                    # Pokud chunk existuje, obarvíme příslušný pixel v mřížce
                                    px = base_px + (cx // 2)
                                    pz = base_pz + (cz // 2)
                                    if 0 <= px < scale_w and 0 <= pz < scale_h:
                                        pixels[px, pz] = C_GRASS
                                except Exception:
                                    pass
            except Exception as e:
                print(f"Chyba při zpracování {filename}: {e}")

        os.makedirs("mapa", exist_ok=True)
        world_img.save(img_output)

        # Vygenerování čisté HTML stránky
        html_content = """<!DOCTYPE html>
        <html lang="cs">
        <head>
            <meta charset="UTF-8">
            <title>Forever Reeds Map</title>
            <style>
                body { margin: 0; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
                #map-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
                img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
            </style>
        </head>
        <body>
            <div id="map-container">
                <img src="map.png" alt="Minecraft World Map">
            </div>
        </body>
        </html>
        """
        
        with open(output_path, "w", encoding="utf-8") as f:
            f.write(html_content)

        print("Mapa byla úspěšně vygenerována!")

    - name: Commit a Push aktualizované mapy
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        git add -A mapa/
        git commit -m "Update mapy světa" || echo "Žádné změny k nahrání"
        git push origin main
