name: Automatická aktualizace mapy světa

on:
  schedule:
    - cron: '0 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Instalace lftp
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp

    - name: Stažení uNmINeD CLI
      run: |
        mkdir -p unmined
        curl -fL \
          -A "Mozilla/5.0" \
          -e "https://unmined.net/downloads/" \
          -o unmined.gz \
          "https://unmined.net/download/unmined-cli-linux-x64-dev/?tmstv=1791238577"

        ls -la unmined.gz
        file unmined.gz

        if tar -tzf unmined.gz >/dev/null 2>&1; then
          tar -xzf unmined.gz -C unmined
        else
          gunzip -c unmined.gz > unmined/unmined-cli
        fi

        UNMINED_BIN=$(find unmined -type f -name "unmined-cli*" | head -n 1)
        chmod +x "$UNMINED_BIN"
        echo "UNMINED_BIN=$PWD/$UNMINED_BIN" >> $GITHUB_ENV
        "$UNMINED_BIN" --version || true

    - name: Stažení světa z Hostify FTP
      run: |
        mkdir -p mc_world/dimensions/minecraft/overworld/region
        lftp -c "open ftp://ftp.hostify.cz:21; \
                 user ${{ secrets.FTP_USER }} ${{ secrets.FTP_PASSWORD }}; \
                 set net:timeout 30; \
                 set net:max-retries 10; \
                 get -O ./mc_world '/minecraft/Forever Reeds/world/level.dat'; \
                 mirror --continue --parallel=10 '/minecraft/Forever Reeds/world/dimensions/minecraft/overworld/region' './mc_world/dimensions/minecraft/overworld/region'"

        echo "--- Počet stažených .mca souborů ---"
        find ./mc_world -name "*.mca" | wc -l

    - name: Render mapy (uNmINeD)
      env:
        DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      run: |
        rm -rf mapa
        mkdir -p mapa
        "$UNMINED_BIN" web render --help | head -n 40 || true
        "$UNMINED_BIN" web render \
          --world="$PWD/mc_world" \
          --output="$PWD/mapa" \
          --dimension=overworld \
          --imageformat=webp \
          --shadows=3d \
          --zoomout=3
        ls -la mapa | head

    - name: Commit a Push aktualizované mapy
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add -A mapa/
        git commit -m "Update mapy světa" || echo "Žádné změny k nahrání"
        git pull --rebase origin main
        git push origin main
