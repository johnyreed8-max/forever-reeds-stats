name: Automatická aktualizace mapy světa (PapyrusCS)

on:
  schedule:
    - cron: '0 3 1,15 * *' # 1. a 15. den v měsíci ve 3:00 ráno
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Instalace .NET SDK a lftp
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalace lftp
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: Vytvoření adresářové struktury
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    - name: Stažení regionů z Hostify FTP
      run: |
        echo "Stahuji level.dat..."
        wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
             "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/level.dat" \
             -O "./mc_world/level.dat" || true

        echo "Stahuji regiony ze správné cesty v dimenzích..."
        mkdir -p ./mc_world/region
        lftp -c "open ftp://ftp.hostify.cz:21; \
                 user ${{ secrets.FTP_USER }} ${{ secrets.FTP_PASSWORD }}; \
                 set net:timeout 60; \
                 set net:max-retries 20; \
                 set ftp:list-options -a; \
                 mirror --continue --verbose '/minecraft/Forever Reeds/world/dimensions/minecraft/overworld/region' './mc_world/region'"

        echo "--- Počet stažených .mca souborů ---"
        find ./mc_world/region/ -name "*.mca" | wc -l

    - name: Instalace a spuštění PapyrusCS
      run: |
        echo "Instaluji PapyrusCS CLI..."
        dotnet tool install -g PapyrusCS || dotnet tool update -g PapyrusCS

        echo "Generuji mapu pomocí PapyrusCS..."
        papyruscs -w ./mc_world -o ./mapa --dim 0 -f png

    - name: Nahrání aktualizované mapy na GitHub
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        git add -A mapa/
        git commit -m "Update mapy světa přes PapyrusCS" || echo "Žádné změny k nahrání"
        git push origin main
