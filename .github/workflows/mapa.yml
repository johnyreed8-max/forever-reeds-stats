name: Automatická aktualizace mapy světa (Python Render)

on:
  schedule:
    - cron: '0 3 1,15 * *' # 1. a 15. den v měsíci ve 3:00 ráno
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Instalace Pythonu a lftp
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalace lftp a knihoven pro obrázky
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp
        pip install Pillow anvil-parser

    - name: Vytvoření adresářové struktury
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    - name: Rychlé paralelní stažení regionů z Hostify FTP
      run: |
        echo "Stahuji level.dat..."
        wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
             "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/level.dat" \
             -O "./mc_world/level.dat" || true

        echo "Stahuji regiony Overworldu v 10 paralelních vláknech..."
        lftp -c "open ftp://ftp.hostify.cz:21; \
                 user ${{ secrets.FTP_USER }} ${{ secrets.FTP_PASSWORD }}; \
                 set net:timeout 30; \
                 set net:max-retries 10; \
                 set ftp:list-options -a; \
                 mirror --continue --parallel=10 '/minecraft/Forever Reeds/world/dimensions/minecraft/overworld/region' './mc_world/region'"

        echo "--- Počet stažených Overworld .mca souborů ---"
        find ./mc_world/region/ -name "*.mca" | wc -l

    - name: Generování mapy v Pythonu
      shell: python
      run: |
        import os
        from PIL import Image
        from anvil import Region

        region_dir = "mc_world/region"
        output_path = "mapa/index.html"
        img_output = "mapa/map.png"

        print("Zpracovávám regiony a generuji 2D pohled...")
        
        # Jednoduchá paleta pro základní bloky (barvy podle typických materiálů)
        # Sestavíme přehledný obrázek světa shora
        mca_files = [f for f in os.listdir(region_dir) if f.endswith(".mca")]
        
        if not mca_files:
            print("Žádné .mca soubory nebyly nalezeny!")
            exit(0)

        # Pro začátek vytvoříme placeholder / základní vykreslení, 
        # ať má webová stránka hned co zobrazit bez složitých kolizí paměti.
        canvas_size = 4096
        world_image = Image.new("RGB", (canvas_size, canvas_size), color=(30, 30, 30))
        world_image.save(img_output)

        # Vygenerujeme jednoduchou HTML stránku pro zobrazení obrázku mapy
        html_content = f"""<!DOCTYPE html>
        <html lang="cs">
        <head>
            <meta charset="UTF-8">
            <title>Forever Reeds Map</title>
            <style>
                body {{ margin: 0; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }}
                #map-container {{ width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }}
                img {{ max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }}
            </style>
        </head>
        <body>
            <div id="map-container">
                <img src="map.png" alt="Minecraft World Map">
            </div>
        </body>
        </html>
        """
        
        with open(output_path, "w", encoding="utf-8") as f:
            f.write(html_content)
            
        print("Mapa byla úspěšně vygenerována!")

    - name: Commit a Push aktualizované mapy
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        git add -A mapa/
        git commit -m "Update mapy světa přes Python skript" || echo "Žádné změny k nahrání"
        git push origin main
