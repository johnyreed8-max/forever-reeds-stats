name: Generování měsíční mapy světa

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Vytvoření složek
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    - name: Kešování Minecraft světa
      uses: actions/cache@v4
      with:
        path: ./mc_world/
        key: mc-world-v1-${{ github.run_number }}
        restore-keys: |
          mc-world-v1-

    - name: Stažení regionů a level.dat z Hostify FTP pomocí wget
      run: |
        # Stažení level.dat se správným názvem proměnné FTP_USER
        wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
             "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/level.dat" \
             -O "./mc_world/level.dat" || true

        # Stažení overworld regionů (vanilla cesta)
        wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
             "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/dimensions/minecraft/overworld/region/*.mca" \
             -P "./mc_world/region/" || true

        echo "--- Kontrola stažených souborů ---"
        ls -la ./mc_world/
        ls -lh ./mc_world/level.dat
        echo "Počet stažených .mca souborů:"
        find ./mc_world/region/ -name "*.mca" | wc -l

    - name: Instalace a spuštění MinedMap (Generování mapy a HTML rozhraní)
      run: |
        # Stažení a rozbalení MinedMapu
        wget -O minedmap.zip https://github.com/neocturne/MinedMap/releases/latest/download/MinedMap-2.8.0-x86_64-unknown-linux-gnu.zip
        unzip -q minedmap.zip
        
        # Získání názvu rozbalené složky a přesun spustitelného souboru
        MINEDMAP_DIR=$(ls -d MinedMap-*/)
        cp ${MINEDMAP_DIR}minedmap ./minedmap
        chmod +x ./minedmap
        
        # Generování dat mapy
        ./minedmap mc_world mapa
        
        # Nakopírování oficiálního HTML vieweru (index.html, JS, CSS) přímo do složky mapa/
        cp -r ${MINEDMAP_DIR}viewer/* mapa/

    - name: Nahrání vygenerované mapy na GitHub větev
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        git add mapa/
        git commit -m "Automatická aktualizace mapy světa" || echo "Žádné změny v mapě"
        git push origin main
