name: Generování měsíční mapy světa

on:
  schedule:
    # Spustí se automaticky 1. den v měsíci ve 4:00 ráno
    - cron: '0 4 1 * *'
  workflow_dispatch: # Umožní spustit i ručně

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Vytvoření složek
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    - name: Stažení regionů z Hostify FTP pomocí wget
      run: |
        # wget stáhne všechny .mca soubory ze složky region přes FTP
        wget --ftp-user="${{ secrets.FTP_USERNAME }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
             "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/dimensions/minecraft/overworld/region/*.mca" \
             -P "./mc_world/region/" -q || true

    - name: Instalace a spuštění MinedMap (Generování mapy)
      run: |
        # Stažení nejnovějšího vydání MinedMap z GitHub Releases (použijeme správný repozitář miurahr/minedmap)
        wget -O minedmap.tar.gz https://github.com/miurahr/minedmap/releases/latest/download/minedmap-linux-x86_64.tar.gz || \
        wget -O minedmap.tar.gz https://github.com/miurahr/minedmap/releases/download/v1.17.0/minedmap-linux-x86_64.tar.gz
        
        # Rozbalení archivu
        tar -xzf minedmap.tar.gz
        
        # Zjištění názvu složky/binárky po rozbalení a spuštění generování
        # (MinedMap se obvykle rozbalí do složky nebo vytvoří spustitelný soubor 'minedmap')
        find . -name "minedmap" -type f
        
        # Spuštění generování mapy (pokud je binárka přímo v aktuálním adr. nebo ve složce)
        ./minedmap mc_world mapa

    - name: Nahrání vygenerované mapy na GitHub větev
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # Přidání vygenerované mapy do gitu
        git add mapa/
        git commit -m "Automatická aktualizace mapy světa" || echo "Žádné změny v mapě"
        git push origin main
