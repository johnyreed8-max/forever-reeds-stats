name: Generování měsíční mapy světa

on:
  schedule:
    # Spustí se automaticky 1. den v měsíci ve 4:00 ráno
    - cron: '0 4 1 * *'
  workflow_dispatch: # Umožní spustit i ručně

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Vytvoření složek
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    - name: Cache pro regiony
      uses: actions/cache@v4
      with:
        path: mc_world/region/
        key: mc-regions-${{ github.run_id }}
        restore-keys: |
          mc-regions-

    - name: Stažení regionů z Hostify FTP pomocí wget
      run: |
        wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
             "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/dimensions/minecraft/overworld/region/*.mca" \
             -P "./mc_world/region/" -q || true

    - name: Instalace a spuštění MinedMap (Generování mapy)
      run: |
        # Stažení nejnovějšího MinedMap z oficiálního repozitáře neocturne/MinedMap
        wget -O minedmap.zip https://github.com/neocturne/MinedMap/releases/latest/download/MinedMap-2.8.0-x86_64-unknown-linux-gnu.zip
        
        # Rozbalení ZIP archivu
        unzip minedmap.zip
        
        # Vygenerování mapy ze stažených regionů
        ./minedmap mc_world mapa

    - name: Nahrání vygenerované mapy na GitHub větev
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # Přidání vygenerované mapy do gitu
        git add mapa/
        git commit -m "Automatická aktualizace mapy světa" || echo "Žádné změny v mapě"
        git push origin main
