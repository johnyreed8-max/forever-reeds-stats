name: Generování měsíční mapy světa

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Vytvoření složek
      run: |
        mkdir -p mc_world/region
        mkdir -p mapa

    - name: Kešování Minecraft světa
      uses: actions/cache@v4
      with:
        path: ./mc_world/
        key: mc-world-v1-cache
        restore-keys: |
          mc-world-v1-

    - name: Stažení regionů a level.dat z Hostify FTP pomocí wget
      run: |
        EXISTING_FILES=$(find ./mc_world/region/ -name "*.mca" | wc -l)
        
        if [ "$EXISTING_FILES" -gt 10 ]; then
          echo "Nalezeno $EXISTING_FILES regionů v cache. Přeskakuji stahování z FTP!"
        else
          echo "Cache je prázdná. Stahuji data z FTP..."
          
          wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
               "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/level.dat" \
               -O "./mc_world/level.dat" || true

          wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
               "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/dimensions/minecraft/overworld/region/*.mca" \
               -P "./mc_world/region/" || true
        fi

        echo "--- Kontrola stavu světa ---"
        ls -la ./mc_world/
        echo "Celkový počet .mca souborů pro MinedMap:"
        find ./mc_world/region/ -name "*.mca" | wc -l

    - name: Instalace a spuštění MinedMap (Generování mapy a strukturování pro viewer)
      run: |
        wget -O minedmap.zip https://github.com/neocturne/MinedMap/releases/latest/download/MinedMap-2.8.0-x86_64-unknown-linux-gnu.zip
        unzip -qo minedmap.zip
        
        find . -name "minedmap" -type f -exec mv {} ./minedmap \;
        chmod +x ./minedmap
        
        # Spuštění generování mapy do dočasné složky raw_map
        ./minedmap mc_world raw_map -j 4

        # Příprava složky mapa pro oficiální viewer
        rm -rf mapa
        mkdir -p mapa/data

        # Přesun dat tam, kde je viewer očekává (do složky mapa/data/)
        mv raw_map/info.json mapa/data/
        mv raw_map/entities.json mapa/data/ || true
        mv raw_map/light mapa/data/ || true
        mv raw_map/map mapa/data/ || true
        mv raw_map/processed mapa/data/ || true
        rm -rf raw_map

        # Stažení a nakopírování oficiálního webového rozhraní (vieweru) do složky mapa/
        git clone https://github.com/neocturne/MinedMap.git minedmap-repo
        cp -r minedmap-repo/viewer/* mapa/
        rm -rf minedmap-repo

    - name: Nahrání vygenerované mapy na GitHub větev
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        git add mapa/
        git commit -m "Automatická aktualizace mapy světa a vieweru" || echo "Žádné změny v mapě"
        git push origin main
