name: Minecraft Stats Auto Updater

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write # Povolí GitHubu ukládat změny do gh-pages větve

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Příprava složky pro statistiky
      run: mkdir -p stats

    - name: Stažení statistik z Hostify FTP
      run: |
        wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/players/stats/*.json" --no-directories --accept="*.json" -P "stats" -q

    - name: Spuštění kompilace do HTML
      shell: pwsh
      run: |
        ./generator.ps1

    # --- TATO ČÁST NAHRADILA GIT COMMIT/PUSH ---
    - name: Nasazení na GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: . # Vystaví obsah aktuální složky (včetně nového index.html)
        publish_branch: gh-pages # Vše se odešle do čisté, izolované větve
