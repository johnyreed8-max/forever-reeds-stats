name: Pouze publikování na GitHub Pages

on:
  schedule:
    # Bude se spouštět každou hodinu, ale o 10 minut později (v celou a 10 minut),
    # aby měl váš první generátor dost času stáhnout data a vytvořit nový index.html
    - cron: '10 * * * *'
  push:
    branches:
      - main # Spustí se také automaticky pokaždé, když váš první skript udělá commit do hlavní větve
  workflow_dispatch: # Umožní vám web publikovat ručně

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načtení kódu z GitHubu
        uses: actions/checkout@v4

      - name: Nastavení GitHub Pages prostředí
        uses: actions/configure-pages@v5

      - name: Nahrání hotového index.html
        uses: actions/upload-pages-artifact@v3
        with:
          # Vezme hotový index.html z kořene repozitáře
          path: '.' 

      - name: Nasazení na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
