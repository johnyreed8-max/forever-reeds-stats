name: Minecraft Stats Auto Updater

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write # DŮLEŽITÉ: Povolení zápisu do repozitáře pro uložení historie
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Příprava složky pro statistiky
      run: mkdir -p stats stats_history

    - name: Stažení statistik z Hostify FTP
      run: |
        wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/players/stats/*.json" --no-directories --accept="*.json" -P "stats" -q

    - name: Spuštění kompilace do HTML (s automatickou opravou syntaxe)
      shell: pwsh
      run: |
        # Automatické ošetření slitých řádků a chybějících mezer z copy-paste
        (Get-Content ./generator.ps1 -Raw) `
          -replace '\$hraciData14Days = @\(\)\$snapshotTodayData = @\{\}', "`$hraciData14Days = @()`n`$snapshotTodayData = @{}" `
          -replace 'in\$crafted', 'in $crafted' `
          -replace 'in\$mined', 'in $mined' `
          -replace 'in\$json', 'in $json' `
          | Set-Content ./generator.ps1

        ./generator.ps1

    # NOVÝ KROK: Uložení snímku historie statistik do Gitu
    - name: Commit a Push historie statistik
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        git add stats_history/
        git commit -m "Update historie statistik [skip ci]" || echo "Žádné nové snímky statistik"
        git push origin main

    - name: Nastavení GitHub Pages prostředí
      uses: actions/configure-pages@v5

    - name: Nahrání vygenerovaného webu jako artefakt
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Nasazení na GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
