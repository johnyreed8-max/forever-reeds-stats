name: Minecraft Stats Auto Updater

on:
  schedule:
    - cron: '0 1 * * *'  # Every day at 1 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Nainstalujte PowerShell Core a jiné závislosti
      run: |
        sudo apt-get update
        sudo apt-get install -y powershell wget unzip

    - name: Stažení statistik z Hostify FTP
      run: |
        mkdir -p stats
        wget --ftp-user="${{ secrets.FTP_USER }}" --ftp-password="${{ secrets.FTP_PASSWORD }}" \
          "ftp://ftp.hostify.cz:21/minecraft/Forever%20Reeds/world/players/stats/*.json" \
          --no-directories --accept="*.json" -P "stats" -nv

        count=$(find stats -name '*.json' | wc -l)
        echo "Staženo souborů: $count"
        if [ "$count" -eq 0 ]; then
          echo "::error::Nepodařilo se stáhnout žádné statistiky, web se nepřepisuje."
          exit 1
        fi

    - name: Spuštění kompilace do HTML
      shell: pwsh
      run: |
        $PSDefaultParameterValues['Out-File:Encoding'] = 'utf8'
        ./generator.ps1

    - name: Upravení mapy pro lepší zoom a odzoom (příklad)
      run: |
        sed -i 's/initialZoomLevel=.*;/initialZoomLevel=5;/' _site/mapa/index.html
        sed -i 's/minZoomLevel=.*;/minZoomLevel=1;/' _site/mapa/index.html
        sed -i 's/maxZoomLevel=.*;/maxZoomLevel=20;/' _site/mapa/index.html

    - name: Přidání nových stránek pro všechny statistiky a zajímavé insighty
      run: |
        echo '<html><head><title>Všechny Statistiky Minecraftu</title></head><body>' > _site/all-stats.html
        echo '<h1>Všechny Statistiky Minecraftu</h1>' >> _site/all-stats.html
        echo '<p>Tady budou zobrazovány všechny dostupné statistiky ze hry.</p>' >> _site/all-stats.html
        echo '</body></html>' >> _site/all-stats.html

        echo '<html><head><title>Zajímavé Insighty</title></head><body>' > _site/interesting-insights.html
        echo '<h1>Zajímavé Insighty</h1>' >> _site/interesting-insights.html
        echo '<p>Tady budou zobrazovány zajímavé analýzy a výběry z statistik, například kdo nejvíce koopal v přepočtu na hodiny.</p>' >> _site/interesting-insights.html
        echo '</body></html>' >> _site/interesting-insights.html

    - name: Commit a Push nového obsahu
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add -A
        git commit -m "Update statistik a mapy" || echo "Žádné změny k nahrání"
        git pull --rebase origin main
        git push origin main

    - name: Nastavení GitHub Pages prostředí
      uses: actions/configure-pages@v5

    - name: Nahrání vygenerovaného webu jako artefakt
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

    - name: Nasazení na GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Logování URL nasazené stránky
      run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
